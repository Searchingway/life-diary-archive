def addStableRepositories = { repositories ->
    repositories.maven { url = uri("https://maven.aliyun.com/repository/google") }
    repositories.maven { url = uri("https://maven.aliyun.com/repository/public") }
    repositories.maven { url = uri("https://maven.aliyun.com/repository/gradle-plugin") }
    repositories.google()
    repositories.mavenCentral()
    repositories.gradlePluginPortal()
}

settingsEvaluated { settings ->
    addStableRepositories(settings.pluginManagement.repositories)
    if (settings.hasProperty("dependencyResolutionManagement")) {
        addStableRepositories(settings.dependencyResolutionManagement.repositories)
    }
}

gradle.beforeProject { project ->
    addStableRepositories(project.buildscript.repositories)
    addStableRepositories(project.repositories)
}
